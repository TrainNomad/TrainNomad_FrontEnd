# Site statique trainnomad.eu sur Render (Blueprint).
# Render n'applique pas les règles à une URL qui correspond à un fichier existant de dist/.
# Le site de test est un service à part, créé à la main dans Render (hors Blueprint) : même dépôt,
# déploiement automatique, une seule règle de réécriture /* -> /index.html.
services:
  - type: web
    name: trainnomad-frontend
    # Site réel : déploiement manuel uniquement (Manual Deploy dans Render), après validation sur le
    # site de test. Les domaines trainnomad.eu et www.trainnomad.eu se rattachent dans
    # Settings > Custom Domains.
    autoDeploy: false
    runtime: static
    branch: main
    buildCommand: npx --yes pnpm@11.24.0 install --frozen-lockfile && npx --yes pnpm@11.24.0 build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Clé MapTiler (fond de carte de l'explorateur) : à saisir dans le tableau de bord Render
      - key: VITE_MAPTILER_KEY
        sync: false
    headers:
      # index.html toujours revalidé : un nouveau déploiement est vu immédiatement
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # fichiers du build (nom avec empreinte) : cache long
      - path: /build/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Anciennes pages du site statique (redirections permanentes, conservent le référencement)
      - type: redirect
        source: /trajets.html
        destination: /trajets
      - type: redirect
        source: /explorer.html
        destination: /explorer
      - type: redirect
        source: /outilstgvmax.html
        destination: /tgvmax
      - type: redirect
        source: /guide/index.html
        destination: /guides
      - type: redirect
        source: /A_propos.html
        destination: /a-propos
      - type: redirect
        source: /conditions.html
        destination: /conditions
      - type: redirect
        source: /confidentialite.html
        destination: /confidentialite
      - type: redirect
        source: /mention_legal.html
        destination: /mentions-legales
      - type: redirect
        source: /404.html
        destination: /
      # /guide/guide.html?ville=… : Render ne réécrit pas les URL avec extension (404) et ne lit pas
      # la query string, mais la conserve en redirigeant. On redirige donc vers /guide/guide?ville=…,
      # d'où l'application envoie vers le guide s'il existe encore, sinon vers /guides
      # (src/pages/LegacyRedirects.tsx).
      - type: redirect
        source: /guide/guide.html
        destination: /guide/guide
      # Pages HTML générées par scripts/prerender.mjs (dist/<page>/index.html). Render ne les sert
      # d'elles-mêmes qu'avec une barre finale (/tgvmax/) : sans ces règles, /tgvmax recevait la page
      # d'accueil. À tenir à jour avec src/lib/pageMeta.json.
      - type: rewrite
        source: /trajets
        destination: /trajets/index.html
      - type: rewrite
        source: /explorer
        destination: /explorer/index.html
      - type: rewrite
        source: /tgvmax
        destination: /tgvmax/index.html
      - type: rewrite
        source: /tgvmax/explorer
        destination: /tgvmax/explorer/index.html
      - type: rewrite
        source: /guides
        destination: /guides/index.html
      - type: rewrite
        source: /a-propos
        destination: /a-propos/index.html
      - type: rewrite
        source: /comment-ca-marche
        destination: /comment-ca-marche/index.html
      - type: rewrite
        source: /conditions
        destination: /conditions/index.html
      - type: rewrite
        source: /confidentialite
        destination: /confidentialite/index.html
      - type: rewrite
        source: /mentions-legales
        destination: /mentions-legales/index.html
      # Un guide = une règle. Pas de règle générique /guides/:slug : pour un guide inexistant, Render
      # renverrait une page vide au lieu de laisser l'application afficher « guide introuvable ».
      # scripts/prerender.mjs signale au build tout guide sans règle ici.
      - type: rewrite
        source: /guides/berlin
        destination: /guides/berlin/index.html
      - type: rewrite
        source: /guides/bruxelles
        destination: /guides/bruxelles/index.html
      - type: rewrite
        source: /guides/barcelone
        destination: /guides/barcelone/index.html
      - type: rewrite
        source: /guides/angers
        destination: /guides/angers/index.html
      - type: rewrite
        source: /guides/lyon
        destination: /guides/lyon/index.html
      - type: rewrite
        source: /guides/marseille
        destination: /guides/marseille/index.html
      - type: rewrite
        source: /guides/paris
        destination: /guides/paris/index.html
      - type: rewrite
        source: /guides/milan
        destination: /guides/milan/index.html
      - type: rewrite
        source: /guides/palermo
        destination: /guides/palermo/index.html
      - type: rewrite
        source: /guides/rome
        destination: /guides/rome/index.html
      - type: rewrite
        source: /guides/amsterdam
        destination: /guides/amsterdam/index.html
      - type: rewrite
        source: /guides/lisbonne
        destination: /guides/lisbonne/index.html
      - type: rewrite
        source: /guides/edinburgh
        destination: /guides/edinburgh/index.html
      - type: rewrite
        source: /guides/prague
        destination: /guides/prague/index.html
      # Tout le reste (résultats de recherche, anciennes adresses, pages inconnues) : l'application
      - type: rewrite
        source: /*
        destination: /index.html
