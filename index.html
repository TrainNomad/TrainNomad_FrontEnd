<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrainNomad.eu · L'Europe en train</title>
    <meta name="description" content="Trouvez vos trajets en train en Europe, explorez les destinations sur une carte et repérez les places TGVmax disponibles. Site indépendant, aucun billet vendu." />
    <meta name="theme-color" content="#1d7a5a" />
    <link rel="canonical" href="https://trainnomad.eu/" />

    <!-- Icônes : tailles multiples de 48 px, attendues par Google pour l'icône des résultats de recherche -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 96x96" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/Logo/SVG/Trainnomad_blanc_svg.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Partage (réseaux sociaux, messageries) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrainNomad.eu" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://trainnomad.eu/" />
    <meta property="og:title" content="TrainNomad.eu · L'Europe en train" />
    <meta property="og:description" content="Trajets en train en Europe, carte des destinations, guides de villes et places TGVmax disponibles." />
    <meta property="og:image" content="https://trainnomad.eu/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Nom du site affiché par Google dans les résultats de recherche -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TrainNomad",
        "alternateName": "TrainNomad.eu",
        "url": "https://trainnomad.eu/"
      }
    </script>

    <!-- Polices, icônes et Tailwind sont intégrés au build (src/main.tsx, tailwind.config.js) : aucun CDN. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
